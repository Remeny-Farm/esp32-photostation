name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (firmware/station/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Run host tests
        run: bash firmware/station/test/run.sh

  python-tests:
    name: Python tests (tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Run mock server tests
        working-directory: tools
        run: python3 -m unittest -v test_mock_server

  firmware:
    name: Firmware compile (xiao_esp32s3 profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02  # v2.0.0
      - name: Cache Arduino cores
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-${{ hashFiles('firmware/station/sketch.yaml') }}
      - name: Compile firmware/station
        run: arduino-cli compile --profile xiao_esp32s3 --warnings default firmware/station
